async function loadFonts(){
  try{
    await Promise.race([
      Promise.all([
        document.fonts.load('700 48px Tajawal','مكتب البوت'),
        document.fonts.load('800 48px Tajawal','مكتب البوت'),

      new Promise(r=>setTimeout(r,5000))

  const palettes=[['#0e1e3a','#d8b25a','#7a1f2b','#f0e4c8'],['#183a35','#e2c070','#1c2330','#f4ead2'],['#2a1a3c','#d9a66b','#a13a52','#efe0c4']];
  const p=palettes[kind%3];g.fillStyle=p[0];g.fillRect(0,0,512,640);
  for(let i=0;i<9;i++){g.globalAlpha=.55;g.fillStyle=p[1+(i%3)];g.beginPath();g.arc(rnd()*512,rnd()*640,40+rnd()*130,0,7);g.fill();}
  g.globalAlpha=1;g.strokeStyle=p[3];g.lineWidth=3;for(let i=0;i<6;i++){g.beginPath();g.moveTo(0,rnd()*640);g.bezierCurveTo(170,rnd()*640,340,rnd()*640,512,rnd()*640);g.stroke();}
  return tex(c,4);
}
function curtainTexture(){
  const c=cv(256,256),g=c.getContext('2d');
  for(let x=0;x<256;x++){const f=.5+.5*Math.sin(x/256*Math.PI*2*6);const v=70+f*42;g.fillStyle=`rgb(${v+35|0},${v-5|0},${v-12|0})`;g.fillRect(x,0,1,256);}
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=gr;g.fillRect(0,0,256,256);
  return tex(c,4);
}
function globeTexture(){
  const c=cv(512,256),g=c.getContext('2d');
  g.fillStyle='#1c4e8c';g.fillRect(0,0,512,256);
  g.fillStyle='#3f8a52';
  for(let i=0;i<22;i++){g.beginPath();g.ellipse(rnd()*512,30+rnd()*196,10+rnd()*42,8+rnd()*26,rnd()*3,0,7);g.fill();}
  g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=1;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(512,i*32);g.stroke();g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,256);g.stroke();}
  return tex(c,4);
}

function updatePeople(t){
  for(const p of people){
    const k=p.ph;
    const br=Math.sin(t*1.9+k);
    p.torso.scale.set(1+.006*br,1+.012*br,1+.008*br);
    p.head.position.y=p.baseHeadY+.006*br;
    // التفاتة هادئة غير منتظمة
    p.lookY=(p.lookY||0)+((p.lookT||0)-(p.lookY||0))*.06;
    p.head.rotation.y=Math.sin(t*.37+k)*.28*(p.lookT?.3:1)+Math.sin(t*.91+k*2)*.08+p.lookY;
    p.head.rotation.x=.06+Math.sin(t*.5+k*1.3)*.035;
    // كتابة متقطعة
    const env=THREE.MathUtils.smoothstep(Math.sin(t*.55+k*.7),-.2,.5);
    p.arms[0].rotation.x=Math.sin(t*13+k)*.022*env;
    p.arms[1].rotation.x=Math.sin(t*11+k*2)*.022*env;
  }
}

function wrapLines(g,text,maxW){
  if(g.measureText(text).width<=maxW)return [text];
  const w=text.split(' ');let best=null,bw=1e9;
  for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' ');const m=Math.max(g.measureText(a).width,g.measureText(b).width);if(m<bw){bw=m;best=[a,b];}}
  return best||[text];
}

  const maxW=W-310,tx=(W-230)/2-8;
  let fs=84,lines=[bot.name];

    const mw=Math.max(...lines.map(l=>g.measureText(l).width));

function mergeStatic(group){
  group.updateMatrixWorld(true);
  const isAnimated=o=>{while(o&&o!==group){if(o.userData.anim)return true;o=o.parent;}return false;};
  const buckets=new Map(),remove=[];
  group.traverse(o=>{
    if(!o.isMesh||isAnimated(o))return;
    const gm=o.geometry.clone().applyMatrix4(o.matrixWorld);
    const ng=gm.index?gm.toNonIndexed():gm;
    for(const k of Object.keys(ng.attributes))if(!['position','normal','uv'].includes(k))ng.deleteAttribute(k);
    if(!ng.attributes.uv){const n=ng.attributes.position.count;ng.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(n*2),2));}
    const key=o.material.uuid;if(!buckets.has(key))buckets.set(key,{mat:o.material,geos:[]});
    buckets.get(key).geos.push(ng);remove.push(o);
  });
  remove.forEach(o=>o.parent&&o.parent.remove(o));
  for(const {mat,geos} of buckets.values()){
    const merged=mergeGeometries(geos,false);if(!merged)continue;
    const m=new THREE.Mesh(merged,mat);m.castShadow=mat.transparent!==true;m.receiveShadow=true;group.add(m);
  }
}

const clock=new THREE.Clock();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(tween){
    const tt=Math.min((performance.now()-tween.t0n)/1000/tween.dur,1);const k=ease(tt);
    camera.position.lerpVectors(tween.p0,tween.p1,k);controls.target.lerpVectors(tween.t0,tween.t1,k);
    viewShift=tween.s0+(tween.s1-tween.s0)*k;applyView();
    if(tt>=1)tween=null;
  }
  controls.target.x=THREE.MathUtils.clamp(controls.target.x,-21.5,21.5);controls.target.z=THREE.MathUtils.clamp(controls.target.z,-19,19);controls.target.y=THREE.MathUtils.clamp(controls.target.y,0,3);
  controls.update();
  updatePeople(t);
  updateAgents(t,dt);
  for(const s of spinners){
    if(s.axis==='y')s.o.rotation.y=t*s.s;
    else if(s.axis==='z')s.o.rotation.z=t*s.s;
    else if(s.axis==='x')s.o.rotation.x=t*s.s;
    else if(s.axis==='swing'){s.o.rotation.y=Math.sin(t*s.s)*.5;s.o.position.y=.68+Math.sin(t*1.6)*.03;}
    else if(s.axis==='look')s.o.rotation.y=Math.sin(t*s.s)*.6;
    else if(s.axis==='ring'){const on=(t%5.5)<1.5;s.o.rotation.z=on?Math.sin(t*46)*.055:0;s.o.position.y=.255+(on?Math.abs(Math.sin(t*46))*.01:0);
      if(s.lamp){s.lamp.emissiveIntensity=on?1.2+Math.sin(t*22)*.9:.25+.2*Math.sin(t*2);}
      if(s.waves){s.waves.visible=on;s.waves.scale.setScalar(.9+.15*Math.sin(t*14));}}
    else if(s.axis==='tilt')s.o.rotation.z=Math.sin(t*s.s)*.07;
    else if(s.axis==='ypos')s.o.position.x=Math.sin(t*1.3)*.25;
  }
  for(const k in byId){const e=byId[k];const d=camera.position.distanceTo(e.label.position);const ag=agentOf[k];e.label.visible=!(ag&&ag.mode!=='desk'&&d<34)&&d>(e===selected?3.2:7);const f=THREE.MathUtils.clamp(d/26,.5,1);const w=e.label.userData.baseW*f;e.label.scale.set(w,w*250/960,1);}
  marker.material.opacity=selected?.5+.35*(.5+.5*Math.sin(t*2.4)):0;
  if(hoverId&&byId[hoverId]!==selected){const e=byId[hoverId];hoverRing.position.set(e.pos.x+e.inward.x*.7,.03,e.pos.z+e.inward.z*.7);hoverRing.scale.setScalar(e.main?1.25:1);hoverRing.material.opacity=.55;}
  else hoverRing.material.opacity=0;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

  else if(k==='lounge'){a.actEnd=t+15+rnd()*8;a.fx=fxLounge;}
  else if(k==='chat'){const cs=a.spotRef.cs;if(!cs.grp)cs.grp={end:t+9+rnd()*6};a.actEnd=cs.grp.end;a.fx=fxTalk;}
  else if(k==='visit'){a.actEnd=t+8+rnd()*4;a.fx=fxTalk;g.host.visitor=a;g.host.e.personRec.lookT=.95;}
  else if(k==='pray'){a.pray={t0:t,i:-1};a.actEnd=t+PRAY_TOTAL;a.fx=fxPray;a.rate=3.4;}
  else if(k==='meet'){a.actEnd=1e9;a.fx=fxMeet;a.arrivedAt=t;}
}
function endAct(a){
  a.fx=null;if(a.rig)a.rig.cup.visible=false;
  const home={kind:'home',dest:a.e.nav.S};freeSpot(a);a.goal=home;
  if(a.seated){a.mode='rising';a.timer=.75;a.tgt=POSE.stand;a.rate=5;a.walking=false;stat(a,'🚶 يقوم من مكانه');}
  else{a.tgt=POSE.stand;plan(a);}
}
/* ---- الحركات أثناء الأنشطة ---- */
const smooth=THREE.MathUtils.smoothstep;
function fxSip(a,f,t){
  const s=((t*.16+a.ph)%1),raise=s<.18?s/.18:s<.5?1:s<.68?1-(s-.5)/.18:0;
  f.aRx=lerp(.35,.75,raise);f.eR=lerp(1.5,2.45,raise);f.aRz=lerp(-.25,-.5,raise);f.hP=raise*.12;
  f.aLx=.15;f.eL=.5;
  if(t>a.nextSay){a.nextSay=t+4+rnd()*4;if(rnd()<.5)say(a,'☕');}
}
function gestureTalk(a,f,t,amt){
  const u=smooth(Math.sin(t*.9+a.ph*1.7),-.2,.5)*amt;
  f.aRx+=u*(.5+.2*Math.sin(t*3.1+a.ph));f.eR+=u*(.9+.3*Math.sin(t*2.3));f.aRz-=u*.15;
  f.aLx+=u*(.35+.2*Math.sin(t*2.6+1));f.eL+=u*.7;
  f.hP+=u*.06*Math.sin(t*4+a.ph);
}
const CHAT_EM=['💬','😄','👍','💡','🤔','😊'];
function fxTalk(a,f,t){
  gestureTalk(a,f,t,1);
  f.hY=Math.sin(t*.7+a.ph)*.35;
  if(t>a.nextSay){a.nextSay=t+3+rnd()*3;say(a,CHAT_EM[(rnd()*CHAT_EM.length)|0]);}
}
function fxLounge(a,f,t){
  gestureTalk(a,f,t,.7);f.hY=Math.sin(t*.45+a.ph)*.4;
  if(t>a.nextSay){a.nextSay=t+4+rnd()*4;say(a,['😊','💬','😄','☕'][(rnd()*4)|0]);}
}
const PRAY=[['qiyam',2.6,0],['ruku',2.0,0],['qiyam',1.4,0],['sajda',2.2,0],['julus',1.3,0],['sajda',2.2,0],['qiyam',1.8,0],['ruku',2.0,0],['qiyam',1.3,0],['sajda',2.2,0],['julus',1.3,0],['sajda',2.2,0],['julus',2.6,0],['julus',1.2,-.95],['julus',1.2,.95],['stand',1.2,0]];
const PRAY_TOTAL=PRAY.reduce((s,p)=>s+p[1],0)+.8;
function fxPray(a,f,t){
  let el=t-a.pray.t0-.6,i=0;
  if(el<0){i=0;}else{for(i=0;i<PRAY.length;i++){if(el<PRAY[i][1])break;el-=PRAY[i][1];}if(i>=PRAY.length)i=PRAY.length-1;}
  if(i!==a.pray.i){a.pray.i=i;const [n,,hy]=PRAY[i];a.tgt=Object.assign({},POSE[n]);a.tgt.hY=hy;a.tgt.hip=POSE[n].hip;}
  if(a.pray.i===0&&el<0){}
}
function fxMeet(a,f,t){
  const sp=meeting.speaker;
  if(a.speaking){gestureTalk(a,f,t,1.15);f.hY=Math.sin(t*.8+a.ph)*.3;f.hP+=Math.sin(t*5+a.ph)*.03;}
  else{
    f.hP+=.14*Math.pow(Math.max(0,Math.sin(t*1.25+a.ph*2)),3);
    if(sp&&sp!==a){const d=clamp(angDiff(a.yaw,facingYaw(sp.x-a.x,sp.z-a.z)),-.95,.95);f.hY=d*.85;}
    f.aLx+=.04*Math.sin(t*.9+a.ph);
  }
  if(t>a.nextSay){a.nextSay=t+5+rnd()*5;if(a.speaking)say(a,'💬');else if(rnd()<.5)say(a,['👍','💡','🤔','😊'][(rnd()*4)|0]);}
}

/* ---------- حلقة تحديث الوكلاء ---------- */
function updateAgent(a,t,dt){
  const e=a.e;
  if(a.mode==='desk')return;
  const r=a.rig;
  if(a.mode==='rising'){a.timer-=dt;if(a.timer<=0){a.seated=false;plan(a);}}
  else if(a.mode==='walk'){
    const n=NAV.n[a.path[a.pi]];
    if(!n){arrive(a);}
    else{
      const dx=n.x-a.x,dz=n.z-a.z,d=Math.hypot(dx,dz),step=SPEED*dt;
      if(d>.02){const want=facingYaw(dx,dz);const df=angDiff(a.yaw,want);a.yaw+=clamp(df,-7*dt,7*dt);}
      if(d<=step){a.x=n.x;a.z=n.z;a.node=a.path[a.pi];a.pi++;if(a.pi>=a.path.length)arrive(a);}
      else{const sp=Math.abs(angDiff(a.yaw,facingYaw(dx,dz)))>1.2?.35:1;a.x+=dx/d*step*sp;a.z+=dz/d*step*sp;}
    }
  }else if(a.mode==='turning'){
    const df=angDiff(a.yaw,a.turnTo);a.yaw+=clamp(df,-5*dt,5*dt);a.timer-=dt;
    if(Math.abs(df)<.06||a.timer<=0)startAct(a);
  }else if(a.mode==='sitting'){
    const s=a.sit;s.t+=dt/.95;const k=ease(Math.min(s.t,1));
    a.x=lerp(s.x0,s.x1,k);a.z=lerp(s.z0,s.z1,k);a.yaw=s.y0+angDiff(s.y0,s.y1)*Math.min(1,k*1.6);
    if(s.t>=1){a.x=s.x1;a.z=s.z1;a.node=s.node;a.yaw=s.y1;a.seated=true;
      if(a.goal.kind==='home')finishHome(a);
      else if(a.goal.dest===s.node)startAct(a);
      else leaveSpot(a);}
  }else if(a.mode==='act'){
    if(t>a.actEnd)endAct(a);
  }
  if(a.mode==='desk'||!r)return;
  // ---- تركيب الوضعية ----
  const c=a.cur,tg=a.tgt,k=1-Math.exp(-dt*a.rate);
  for(const key of PK)c[key]+=(tg[key]-c[key])*k;
  a.amp+=((a.walking&&a.mode==='walk'?1:0)-a.amp)*(1-Math.exp(-dt*7));
  const f=SCR;for(const key of PK)f[key]=c[key];
  if(a.mode==='walk'||a.amp>.02){
    if(a.mode==='walk')a.phase+=dt*SPEED/1.55*TAU2;
    const am=a.amp,s=Math.sin(a.phase),co=Math.cos(a.phase);
    f.thL+=s*.55*am;f.thR-=s*.55*am;
    f.knL-=Math.max(0,co)*.95*am+.05*am;f.knR-=Math.max(0,-co)*.95*am+.05*am;
    f.aLx-=s*.5*am;f.aRx+=s*.5*am;f.eL+=.28*am;f.eR+=.28*am;
    f.hip+=(-.035+.03*Math.abs(co))*am;f.twist+=s*.11*am;f.pitch-=.05*am;
  }
  if(a.mode==='act'&&a.fx)a.fx(a,f,t);
  applyRig(r,f);
  r.root.position.set(a.x,0,a.z);r.root.rotation.y=a.yaw;
  r.tag.position.set(a.x,f.hip<.8?2.5:2.85,a.z);
  const d=camera.position.distanceTo(r.tag.position),w=clamp(d*.062,.9,3.2);r.tag.scale.set(w,w/4,1);
}
const meeting={state:'idle',members:[],t0:0,nextAt:26,speaker:null,nextSpeak:0,slide:0,nextSlide:0,endAt:0};
function setScreen(k){const S=ZONES.meeting.screen;S.mat.map=S.maps[k];S.mat.needsUpdate=true;}
const shuffle=arr=>{for(let i=arr.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
function startMeeting(manual){
  if(meeting.state!=='idle')return false;
  const t=T0(),N=isMobile?6:8;
  const tech=agentOf.tech;
  const pool=shuffle(agents.filter(a=>a!==tech&&a.act!=='pray'));
  const members=[tech,...pool.slice(0,N-1)];
  const seats=ZONES.meeting.seats;seats.forEach(s=>s.occ=null);
  const north=seats.filter(s=>s.row==='n').sort((a,b)=>a.x-b.x),south=seats.filter(s=>s.row==='s').sort((a,b)=>a.x-b.x);
  const order=[north[2],...shuffle([north[0],north[1],north[3],north[4]]),...shuffle(south.slice())];
  members.forEach((a,i)=>{
    const s=order[i];s.occ=a.id;
    if(a.spotRef)freeSpot(a);
    a.inMeet=true;a.spotRef={kind:'spot',spot:s};
    sendTo(a,{kind:'meet',dest:s.node,yaw:s.yaw,top:s.top});
  });
  meeting.members=members;meeting.state='gather';meeting.t0=t;meeting.speaker=null;
  return true;
}
function updateMeeting(t){
  const m=meeting;
  if(m.state==='idle'){if(t>m.nextAt)startMeeting(false);return;}
  if(m.state==='gather'){
    const n=m.members.filter(a=>a.mode==='act'&&a.act==='meet').length;
    if(n===m.members.length||t>m.t0+55){m.state='session';m.endAt=t+(isMobile?24:30)+rnd()*8;m.nextSpeak=t;m.nextSlide=t;m.slide=0;}
  }else if(m.state==='session'){
    if(t>m.nextSpeak){
      const here=m.members.filter(a=>a.mode==='act'&&a.act==='meet');
      if(m.speaker)m.speaker.speaking=false;
      const c=here.filter(a=>a!==m.speaker);m.speaker=c.length?c[(rnd()*c.length)|0]:null;
      if(m.speaker){m.speaker.speaking=true;say(m.speaker,'💬');}
      m.nextSpeak=t+4+rnd()*2.5;
    }
    if(t>m.nextSlide){m.slide=m.slide%3+1;setScreen('s'+m.slide);m.nextSlide=t+7;}
    if(t>m.endAt){
      m.state='dismiss';if(m.speaker)m.speaker.speaking=false;m.speaker=null;setScreen('idle');
      for(const a of m.members){
        if(a.mode==='act'&&a.act==='meet')a.actEnd=t+.3+rnd()*2;
        else if(a.mode!=='desk'&&!(a.goal&&a.goal.kind==='home'))sendTo(a,{kind:'home',dest:a.e.nav.S});
      }
    }
  }else if(m.state==='dismiss'){
    if(m.members.every(a=>a.mode==='desk')){m.state='idle';m.nextAt=t+(isMobile?60:70)+rnd()*40;m.members.forEach(a=>a.inMeet=false);}
  }
}
/* ---- النشاطات العشوائية ---- */
const freeOf=list=>list.filter(s=>!s.occ);
function wander(a,t){
  const opts=[];
  const Z=ZONES;
  if(freeOf(Z.coffee.spots).length)opts.push(['coffee',2.6]);
  if(freeOf(Z.lounge.spots).length)opts.push(['lounge',2.0]);
  if(freeOf(Z.prayer.spots).length)opts.push(['pray',a.prayW]);
  const hosts=agents.filter(h=>h!==a&&h.mode==='desk'&&!h.visitor&&!h.inMeet);
  if(hosts.length)opts.push(['visit',3.2]);
  const partners=hosts.length;const freeChat=Z.chat.filter(c=>c.occ.every(o=>!o));
  if(partners&&freeChat.length)opts.push(['chat',2.4]);
  if(!opts.length)return false;
  let tot=opts.reduce((s,o)=>s+o[1],0),r=rnd()*tot,k=opts[0][0];
  for(const o of opts){if((r-=o[1])<=0){k=o[0];break;}}
  if(k==='visit'){const h=hosts[(rnd()*hosts.length)|0];sendTo(a,{kind:'visit',dest:h.e.nav.V,yaw:h.e.faceVisit,host:h});}
  else if(k==='chat'){
    const cs=freeChat[(rnd()*freeChat.length)|0],n=(partners>=2&&rnd()<.4)?3:2;
    const group=[a,...shuffle(hosts.slice()).slice(0,n-1)];
    group.forEach((g,i)=>{cs.occ[i]=g.id;g.spotRef={kind:'chat',cs,idx:i};const nd=cs.nodes[i];sendTo(g,{kind:'chat',dest:nd.id,yaw:nd.yaw});});
  }else{
    const sp=k==='coffee'?Z.coffee.spots:k==='lounge'?Z.lounge.spots:Z.prayer.spots;
    const fs=freeOf(sp),s=fs[(rnd()*fs.length)|0];s.occ=a.id;a.spotRef={kind:'spot',spot:s};
    sendTo(a,{kind:k,dest:s.node,yaw:s.yaw,top:s.top||0});
  }
  return true;
}
let schedT=0;
function updateAgents(_t,dt){
  if(!agents.length)return;
  simT+=dt;const t=simT;
  for(const a of agents)updateAgent(a,t,dt);
  updateBubbles(dt);
  schedT-=dt;
  if(schedT<=0){
    schedT=.5;updateMeeting(t);
    const away=agents.filter(a=>a.mode!=='desk').length;
    const cap=meeting.state!=='idle'?meeting.members.length+2:(isMobile?3:5);
    let n=away;
    for(const a of shuffle(agents.slice())){
      if(n>=cap)break;
      if(a.mode==='desk'&&t>a.next&&!a.visitor&&!a.inMeet){
        const before=agents.filter(x=>x.mode!=='desk').length;
        if(wander(a,t)){n=agents.filter(x=>x.mode!=='desk').length;}
        else a.next=t+6;
        if(n>before)a.next=t+20;
      }
    }
    const bm=document.getElementById('btnMeet');if(bm){const busy=meeting.state!=='idle';if(bm.classList.contains('busy')!==busy){bm.classList.toggle('busy',busy);bm.lastElementChild.textContent=busy?'الاجتماع شغّال':'اجتماع الآن';}}
    refreshStatus();
  }
  followSelected(dt);
}
/* ---------- حالة البوت في البطاقة + تتبّع الكاميرا ---------- */
let lastStat='';
function refreshStatus(){
  if(!selected)return;const a=agentOf[selected.bot.id];if(!a)return;
  const el=document.getElementById('pStatus');if(a.stat!==lastStat||el.dataset.id!==a.id){lastStat=a.stat;el.dataset.id=a.id;el.textContent=a.stat;el.className='status '+(a.mode==='desk'?'desk':a.mode==='act'?'act':'move');}
}
let fol={x:0,z:0,id:null};
function followSelected(dt){
  if(!selected){fol.id=null;return;}
  const a=agentOf[selected.bot.id];if(!a)return;
  const away=a.mode!=='desk';
  if(away){
    marker.position.set(a.x,.03,a.z);marker.scale.setScalar(.55);
    if(fol.id===a.id&&!tween){const dx=a.x-fol.x,dz=a.z-fol.z;camera.position.x+=dx;camera.position.z+=dz;controls.target.x+=dx;controls.target.z+=dz;}
  }else{const e=selected;marker.position.set(e.pos.x+e.inward.x*.7,.03,e.pos.z+e.inward.z*.7);marker.scale.setScalar(e.main?1.25:1);}
  fol.id=a.id;fol.x=a.x;fol.z=a.z;
}
function focusFor(e){
  const a=agentOf[e.bot.id];
  if(a&&a.mode!=='desk')return {pos:new THREE.Vector3(a.x,0,a.z),inward:new THREE.Vector3(0,0,1),away:true};
  return {pos:e.pos,inward:e.inward,away:false};
}
const visChain=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
function walkerPickables(){const l=[];for(const a of agents)if(a.rig&&a.rig.root.visible){for(const m of a.rig.meshes)l.push(m);l.push(a.rig.tag);}return l;}
/* ---------- الأماكن في القائمة ---------- */
const PLACES=[
  {id:'meeting',emoji:'📅',name:'غرفة الاجتماعات',t:[19.4,.7,-16.2],c:[12.4,8.2,-8.4]},
  {id:'coffee',emoji:'☕',name:'ركن القهوة',t:[-20,1,16],c:[-12.5,6.4,11]},
  {id:'lounge',emoji:'🛋️',name:'صالة الاستراحة',t:[19.5,.6,16.2],c:[12.5,6.8,10.5]},
  {id:'prayer',emoji:'🕌',name:'المصلى',t:[-19,.5,-16.3],c:[-12,10,-6.5]},
];
function goPlace(id){
  const p=PLACES.find(x=>x.id===id);if(!p)return;
  if(selected)setLabel(selected,false);selected=null;document.body.classList.remove('sel');panel.classList.remove('open');
  document.getElementById('btnHome').hidden=false;document.getElementById('hint').style.opacity=0;document.getElementById('drawer').classList.remove('open');
  applyFov(innerWidth<700?58:46);
  flyTo(new THREE.Vector3(...p.c),new THREE.Vector3(...p.t),1.3,0);

function buildPlacesUI(){
  const list=document.getElementById('list');
  const h=document.createElement('h3');h.textContent='الأماكن في المكتب';h.style.margin='12px 10px 6px';list.appendChild(h);
  PLACES.forEach(p=>{const b=document.createElement('button');b.innerHTML=`<span class="ic">${p.emoji}</span><span>${p.name}</span>`;b.onclick=()=>goPlace(p.id);list.appendChild(b);});
  const bm=document.getElementById('btnMeet');

  bm.onclick=()=>{

  };
}
function initAgents(){
  buildNav();
  for(const bot of BOTS)makeAgent(byId[bot.id]);
  let q=0;const warm=()=>{if(q<agents.length){ensureRig(agents[q++]);setTimeout(warm,140);}};setTimeout(warm,1200);
}
function dbgPose(id,x,z,yaw,pose){const a=agentOf[id];ensureRig(a);showRig(a,true);a.mode='dbg';a.x=x;a.z=z;a.yaw=yaw;a.cur=Object.assign({},typeof pose==='string'?POSE[pose]:pose);a.tgt=a.cur;a.rig.root.position.set(x,0,z);a.rig.root.rotation.y=yaw;applyRig(a.rig,a.cur);a.rig.tag.position.set(x,2.85,z);}
init().then(()=>requestAnimationFrame(frame)).catch(e=>{console.error(e);document.getElementById('loader').innerHTML='<div>صار خطأ بسيط في تجهيز المكتب، حدّث الصفحة.</div>';});
